name: flutter_bnx_mail
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  fl_chart: ^0.69.0
  file_picker: ^8.0.3
  url_launcher: ^6.3.1
  # Backend integration
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  lucide_icons_flutter: ^3.1.14+2

  http_parser: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/bnx_mail_logo.png"

flutter_native_splash:
  color: "#ffffff"
  image: "assets/bnx_mail_logo.png"
  android: true
  ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg
    - assets/bit_tool_logo.png
    - assets/bnx_mail_logo.png
    - assets/beta_logo.jpg
    - assets/cliks_logo.png
    - assets/cliks_business_img.png
    - lib/standalone_macos_storage/assets/
    - .env
